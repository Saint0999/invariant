<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The tab mark is the header brand mark, shrunk: silver chip, dark glyph.
    Same gradient stops and same lucide ArrowUpDown as the chip in
    components/shell/ToolShell.tsx and the landing navbar — if that chip ever
    changes, change this too or the tab stops matching the page.

    Next's App Router picks this up from app/icon.svg automatically; there is no
    <link> to maintain in layout.tsx.
  -->
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="0.5" stop-color="#E4E4E7" />
      <stop offset="1" stop-color="#A1A1AA" />
    </linearGradient>
  </defs>

  <!-- Radius tracks rounded-xl on the 36px chip (12/36), scaled to 32. -->
  <rect width="32" height="32" rx="10.7" fill="url(#chip)" />

  <!--
    Glyph is drawn in lucide's 24-unit box and scaled to 18px, a touch larger
    than the 16px it sits at in the header: at 16px tab size the arrows need
    the extra weight to read as arrows at all.
  -->
  <g transform="translate(7 7) scale(0.75)" fill="none" stroke="#141416" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="m21 16-4 4-4-4" />
    <path d="M17 20V4" />
    <path d="m3 8 4-4 4 4" />
    <path d="M7 4v16" />
  </g>
</svg>
